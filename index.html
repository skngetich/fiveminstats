<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>5-Min Stats</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --made: #16a34a; --made-bg: #dcfce7; --miss: #dc2626; --miss-bg: #fee2e2;
    --accent: #ea580c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f17; --card: #161b26; --text: #f3f4f6; --muted: #9ca3af; --line: #273042;
      --made-bg: #123821; --miss-bg: #3d1515;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 16px);
    max-width: 560px; margin-inline: auto; user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; }
  h1 { font-size: 20px; margin: 0; }
  h1 span { color: var(--accent); }
  .tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
  .tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
    padding: 10px 0; border-radius: 9px; }
  .tabs button.active { background: var(--accent); color: #fff; }
  .tabs.sub { margin-top: 8px; }
  .tabs.sub button { padding: 8px 0; font-size: 14px; }
  .tabs.sub button.active { background: var(--text); color: var(--bg); }
  .period-label { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; grid-column: 1 / -1; }
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 12px 0; padding: 10px; text-align: center; }
  .scoreboard .pts { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .scoreboard .dash { color: var(--muted); padding: 0 8px; }
  .name-wrap { position: relative; }
  .team-name { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--text); text-align: center;
    font: inherit; font-weight: 600; font-size: 16px; padding: 6px 22px; border-radius: 8px; }
  .team-name:focus { outline: none; border-color: var(--accent); }
  .name-wrap::after { content: "✎"; position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 13px; pointer-events: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .col { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
  .col h2 { font-size: 14px; margin: 0 0 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shot { margin-bottom: 10px; }
  .shot:last-child { margin-bottom: 0; }
  .shot-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .shot-head b { color: var(--text); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btns button { border: 0; border-radius: 10px; font: inherit; font-weight: 700; padding: 16px 0;
    display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .btns button small { font-size: 11px; font-weight: 600; opacity: .8; }
  .btns .made { background: var(--made-bg); color: var(--made); }
  .btns .miss { background: var(--miss-bg); color: var(--miss); }
  .btns button:active { transform: scale(.95); filter: brightness(.9); }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .actions button { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: inherit; font-weight: 600; padding: 12px; border-radius: 10px; }
  .actions button:disabled { opacity: .4; }
  .actions .danger { color: var(--miss); }
  .log { font-size: 12px; color: var(--muted); text-align: center; min-height: 18px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; margin-bottom: 14px; font-size: 14px; font-variant-numeric: tabular-nums; }
  caption { text-align: left; font-weight: 700; padding: 6px 2px; }
  th, td { padding: 9px 6px; text-align: center; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-size: 12px; font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td .pct { display: block; font-size: 11px; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1><span>5</span>-Min Stats</h1>
</header>

<nav class="tabs" id="mainTabs">
  <button data-view="1">Q1</button>
  <button data-view="2">Q2</button>
  <button data-view="3">Q3</button>
  <button data-view="4">Q4</button>
  <button data-view="ot">OT</button>
  <button data-view="summary">Stats</button>
</nav>

<section id="tracker">
  <nav class="tabs sub" id="halfTabs">
    <button data-half="first">First 5 min</button>
    <button data-half="last">Last 5 min</button>
  </nav>
  <div class="scoreboard">
    <div class="period-label" id="periodLabel"></div>
    <div><div class="name-wrap"><input class="team-name" data-team="0" maxlength="20" placeholder="Home team" aria-label="Home team name" enterkeyhint="done"></div><div class="pts" id="pts0">0</div></div>
    <div class="dash">–</div>
    <div><div class="name-wrap"><input class="team-name" data-team="1" maxlength="20" placeholder="Away team" aria-label="Away team name" enterkeyhint="done"></div><div class="pts" id="pts1">0</div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="actions">
    <button id="undo">↶ Undo</button>
    <button id="reset" class="danger">Reset game</button>
  </div>
  <div class="log" id="log"></div>
</section>

<section id="summary" class="hidden">
  <nav class="tabs sub" id="sumTabs" style="margin-bottom:12px">
    <button data-sum="1">Q1</button>
    <button data-sum="2">Q2</button>
    <button data-sum="3">Q3</button>
    <button data-sum="4">Q4</button>
    <button data-sum="ot">OT</button>
    <button data-sum="all">Game</button>
  </nav>
  <div id="summaryTables"></div>
  <div class="actions">
    <button id="share">Share / Copy stats</button>
    <button id="reset2" class="danger">Reset game</button>
  </div>
  <div class="log" id="log2"></div>
</section>

<script>
const KEY = 'fiveminstats.v2';
const SHOTS = [
  { k: 't3', label: '3PT', pts: 3 },
  { k: 't2', label: '2PT', pts: 2 },
  { k: 'ft', label: 'FT',  pts: 1 },
];
const QUARTERS = ['1', '2', '3', '4'];
const HALVES = { first: 'First 5 min', last: 'Last 5 min' };
// OT is only 5 minutes, so it's tracked as one period (all OTs combined)
const OT_HALVES = { full: 'All overtime' };
const halvesFor = q => q === 'ot' ? OT_HALVES : HALVES;
const periodName = (q, half) => q === 'ot' ? 'Overtime' : `Q${q} · ${HALVES[half]}`;

const blankTeam = () => ({ t3m: 0, t3x: 0, t2m: 0, t2x: 0, ftm: 0, ftx: 0 });
const blankStats = () => ({
  ...Object.fromEntries(QUARTERS.map(q =>
    [q, { first: [blankTeam(), blankTeam()], last: [blankTeam(), blankTeam()] }])),
  ot: { full: [blankTeam(), blankTeam()] },
});
const blankState = () => ({
  teams: ['Home', 'Away'],
  view: '1',      // '1'..'4', 'ot' or 'summary'
  half: 'first',  // 'first' | 'last' (ignored in OT)
  sum: '1',       // summary filter: '1'..'4', 'ot' or 'all'
  stats: blankStats(),
  history: [],
});

let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!state) {
  state = blankState();
  // Keep team names from the previous version
  try { const old = JSON.parse(localStorage.getItem('fiveminstats.v1')); if (old?.teams) state.teams = old.teams; } catch {}
}
// Games saved before OT existed
if (!state.stats.ot) state.stats.ot = blankStats().ot;
const curHalf = () => state.view === 'ot' ? 'full' : state.half;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

const $ = s => document.querySelector(s);
const pct = (m, a) => a ? Math.round(m / a * 100) + '%' : '–';
const points = s => s.t3m * 3 + s.t2m * 2 + s.ftm;
const sumTeams = list => list.reduce((acc, s) => {
  for (const k in acc) acc[k] += s[k];
  return acc;
}, blankTeam());
// Stats for team t in a half, for one quarter or summed across the game
const statsFor = (q, half, t) => q === 'all'
  ? sumTeams(QUARTERS.map(x => state.stats[x][half][t]))
  : state.stats[q][half][t];

function renderTracker() {
  const stats = state.stats[state.view][curHalf()];
  document.querySelectorAll('.team-name').forEach(i => {
    if (document.activeElement !== i) i.value = state.teams[i.dataset.team];
  });
  $('#halfTabs').classList.toggle('hidden', state.view === 'ot');
  $('#periodLabel').textContent = periodName(state.view, curHalf());
  $('#pts0').textContent = points(stats[0]);
  $('#pts1').textContent = points(stats[1]);

  $('#grid').innerHTML = [0, 1].map(t => `
    <div class="col">
      <h2>${esc(state.teams[t])}</h2>
      ${SHOTS.map(({ k, label }) => {
        const m = stats[t][k + 'm'], x = stats[t][k + 'x'];
        return `<div class="shot">
          <div class="shot-head"><b>${label}</b><span>${m}/${m + x} · ${pct(m, m + x)}</span></div>
          <div class="btns">
            <button class="made" data-t="${t}" data-f="${k}m">✓<small>${m}</small></button>
            <button class="miss" data-t="${t}" data-f="${k}x">✗<small>${x}</small></button>
          </div></div>`;
      }).join('')}
    </div>`).join('');
  $('#undo').disabled = !state.history.length;
}

function row(name, s) {
  const cell = (m, a) => `${m}/${a}<span class="pct">${pct(m, a)}</span>`;
  const fgm = s.t3m + s.t2m, fga = fgm + s.t3x + s.t2x;
  return `<tr><td>${esc(name)}</td>
    <td>${cell(s.t3m, s.t3m + s.t3x)}</td>
    <td>${cell(s.t2m, s.t2m + s.t2x)}</td>
    <td>${cell(fgm, fga)}</td>
    <td>${cell(s.ftm, s.ftm + s.ftx)}</td>
    <td><b>${points(s)}</b></td></tr>`;
}

const otPlayed = () => state.stats.ot.full.some(s => Object.values(s).some(v => v > 0));

// Tables to show for a summary filter: [quarter, half, caption]
function sections(q) {
  if (q === 'ot') return [['ot', 'full', 'Overtime (all OT periods)']];
  if (q !== 'all') return Object.entries(HALVES).map(([half, title]) => [q, half, `Q${q} · ${title}`]);
  return [
    ...Object.entries(HALVES).map(([half, title]) => ['all', half, `Game · all ${title.toLowerCase()}s (Q1–Q4)`]),
    ...(otPlayed() ? sections('ot') : []),
  ];
}

function renderSummary() {
  $('#summaryTables').innerHTML = sections(state.sum).map(([q, half, caption]) => `
    <table>
      <caption>${caption}</caption>
      <thead><tr><th>Team</th><th>3PT</th><th>2PT</th><th>FG</th><th>FT</th><th>PTS</th></tr></thead>
      <tbody>${[0, 1].map(t => row(state.teams[t], statsFor(q, half, t))).join('')}</tbody>
    </table>`).join('');
}

function render() {
  document.querySelectorAll('#mainTabs button').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  document.querySelectorAll('#halfTabs button').forEach(b => b.classList.toggle('active', b.dataset.half === state.half));
  document.querySelectorAll('#sumTabs button').forEach(b => b.classList.toggle('active', b.dataset.sum === state.sum));
  const isSummary = state.view === 'summary';
  $('#tracker').classList.toggle('hidden', isSummary);
  $('#summary').classList.toggle('hidden', !isSummary);
  isSummary ? renderSummary() : renderTracker();
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function flash(msg, el = '#log') {
  $(el).textContent = msg;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => $(el).textContent = '', 2500);
}

function describe(h) {
  const shot = SHOTS.find(s => h.f.startsWith(s.k)).label;
  const where = h.q === 'ot' ? 'OT' : `Q${h.q} ${h.h} 5`;
  return `${where} – ${state.teams[h.t]} ${shot} ${h.f.endsWith('m') ? 'made' : 'missed'}`;
}

// Events
$('#mainTabs').addEventListener('click', e => {
  const v = e.target.closest('button')?.dataset.view;
  if (!v) return;
  // Opening the summary jumps to the quarter you were tracking
  if (v === 'summary' && state.view !== 'summary') state.sum = state.view;
  // Switching to a different quarter starts at its first 5 minutes
  if (v !== 'summary' && state.view !== 'summary' && v !== state.view) state.half = 'first';
  state.view = v; save(); render();
});

$('#halfTabs').addEventListener('click', e => {
  const h = e.target.closest('button')?.dataset.half;
  if (!h) return;
  state.half = h; save(); render();
});

$('#sumTabs').addEventListener('click', e => {
  const q = e.target.closest('button')?.dataset.sum;
  if (!q) return;
  state.sum = q; save(); render();
});

$('#grid').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]');
  if (!b) return;
  const h = { q: state.view, h: curHalf(), t: +b.dataset.t, f: b.dataset.f };
  state.stats[h.q][h.h][h.t][h.f]++;
  state.history.push(h);
  if (navigator.vibrate) navigator.vibrate(15);
  save(); render();
  flash(describe(h));
});

$('#undo').addEventListener('click', () => {
  const h = state.history.pop();
  if (!h) return;
  const s = state.stats[h.q][h.h][h.t];
  s[h.f] = Math.max(0, s[h.f] - 1);
  state.view = h.q;
  if (h.h !== 'full') state.half = h.h;
  save(); render();
  flash('Undid: ' + describe(h));
});

document.querySelectorAll('.team-name').forEach(i => {
  i.addEventListener('input', () => {
    state.teams[i.dataset.team] = i.value.trim() || (i.dataset.team === '0' ? 'Home' : 'Away');
    save(); renderTracker();
  });
  i.addEventListener('focus', () => i.select());
  i.addEventListener('blur', () => { i.value = state.teams[i.dataset.team]; });
  i.addEventListener('keydown', e => { if (e.key === 'Enter') i.blur(); });
});

function reset() {
  if (!confirm('Clear all stats for this game? Team names are kept.')) return;
  const teams = state.teams;
  state = blankState();
  state.teams = teams;
  save(); render();
}
$('#reset').addEventListener('click', reset);
$('#reset2').addEventListener('click', reset);

$('#share').addEventListener('click', async () => {
  const f = (m, x) => `${m}/${m + x} (${pct(m, m + x)})`;
  const lines = [`${state.teams[0]} vs ${state.teams[1]} – 5-min shooting stats`, ''];
  const groups = [...QUARTERS, ...(otPlayed() ? ['ot'] : []), 'all'];
  const heading = { ot: '== OVERTIME ==', all: '== GAME TOTALS (Q1–Q4) ==' };
  for (const q of groups) {
    lines.push(heading[q] || `== Q${q} ==`);
    for (const [half, title] of Object.entries(halvesFor(q))) {
      if (q !== 'ot') lines.push(`${title}:`);
      [0, 1].forEach(t => {
        const s = statsFor(q, half, t);
        lines.push(`  ${state.teams[t]}: ${points(s)} pts | 3PT ${f(s.t3m, s.t3x)} | 2PT ${f(s.t2m, s.t2x)} | FT ${f(s.ftm, s.ftx)}`);
      });
    }
    lines.push('');
  }
  const text = lines.join('\n').trim();
  try {
    if (navigator.share) await navigator.share({ title: '5-Min Stats', text });
    else { await navigator.clipboard.writeText(text); flash('Copied to clipboard', '#log2'); }
  } catch (err) {
    if (err.name !== 'AbortError') flash('Could not share', '#log2');
  }
});

render();
</script>
</body>
</html>
