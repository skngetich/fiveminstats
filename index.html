<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>5-Min Stats</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --made: #16a34a; --made-bg: #dcfce7; --miss: #dc2626; --miss-bg: #fee2e2;
    --accent: #ea580c;
    --team0: #2a78d6; --team1: #eb6834; /* chart series: home, away */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f17; --card: #161b26; --text: #f3f4f6; --muted: #9ca3af; --line: #273042;
      --made-bg: #123821; --miss-bg: #3d1515;
      --team0: #3987e5; --team1: #d95926;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 16px);
    max-width: 560px; margin-inline: auto; user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; }
  h1 { font-size: 20px; margin: 0; }
  h1 span { color: var(--accent); }
  .tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
  .tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
    padding: 10px 0; border-radius: 9px; }
  .tabs button.active { background: var(--accent); color: #fff; }
  .tabs.sub { margin-top: 8px; }
  .tabs.sub button { padding: 8px 0; font-size: 14px; }
  .tabs.sub button.active { background: var(--text); color: var(--bg); }
  .period-label { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; grid-column: 1 / -1; }
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 12px 0; padding: 10px; text-align: center; }
  .scoreboard .pts { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .scoreboard .dash { color: var(--muted); padding: 0 8px; }
  .name-wrap { position: relative; }
  .team-name { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--text); text-align: center;
    font: inherit; font-weight: 600; font-size: 16px; padding: 6px 22px; border-radius: 8px; }
  .team-name:focus { outline: none; border-color: var(--accent); }
  .name-wrap::after { content: "✎"; position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 13px; pointer-events: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .col { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
  .col h2 { font-size: 14px; margin: 0 0 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shot { margin-bottom: 10px; }
  .shot:last-child { margin-bottom: 0; }
  .shot-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .shot-head b { color: var(--text); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btns button { border: 0; border-radius: 10px; font: inherit; font-weight: 700; padding: 16px 0;
    display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .btns button small { font-size: 11px; font-weight: 600; opacity: .8; }
  .btns .made { background: var(--made-bg); color: var(--made); }
  .btns .miss { background: var(--miss-bg); color: var(--miss); }
  .btns button:active { transform: scale(.95); filter: brightness(.9); }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .actions button { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: inherit; font-weight: 600; padding: 12px; border-radius: 10px; }
  .actions button:disabled { opacity: .4; }
  .actions .danger { color: var(--miss); }
  .log { font-size: 12px; color: var(--muted); text-align: center; min-height: 18px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; margin-bottom: 14px; font-size: 14px; font-variant-numeric: tabular-nums; }
  caption { text-align: left; font-weight: 700; padding: 6px 2px; }
  th, td { padding: 9px 6px; text-align: center; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-size: 12px; font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td .pct { display: block; font-size: 11px; color: var(--muted); }
  .hdr-btn { border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit;
    font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 999px; }
  .hdr-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .new-game { width: 100%; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 700;
    padding: 14px; border-radius: 12px; margin: 12px 0; }
  .game-item { display: flex; align-items: stretch; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  .game-item.current { border-color: var(--accent); }
  .game-item .open { flex: 1; text-align: left; border: 0; background: none; color: var(--text); font: inherit; padding: 12px; }
  .game-item .open b { display: block; }
  .game-item .open small { color: var(--muted); font-size: 12px; }
  .game-item .badge { color: var(--accent); font-weight: 700; }
  .game-item .del { border: 0; border-left: 1px solid var(--line); background: none; color: var(--miss);
    font-size: 18px; padding: 0 16px; }
  /* Insights */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .card h3 { font-size: 15px; margin: 0 0 8px; }
  .card .note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .insight-list { margin: 0; padding: 0; list-style: none; }
  .insight-list li { padding: 7px 0 7px 16px; border-bottom: 1px solid var(--line); font-size: 14px; position: relative; }
  .insight-list li:last-child { border-bottom: 0; }
  .insight-list li::before { content: ""; position: absolute; left: 0; top: 14px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--dot, var(--muted)); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .chart .axis { font-size: 10px; fill: var(--muted); }
  .chart .qlabel { font-size: 11px; font-weight: 600; fill: var(--text); }
  .chart .hit { fill: transparent; outline: none; }
  .chart .wash { fill: var(--text); opacity: 0; }
  .chart .wash.on { opacity: .06; }
  .tip { position: absolute; top: 0; pointer-events: none; background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; white-space: nowrap;
    box-shadow: 0 4px 14px rgb(0 0 0 / .15); transform: translateX(-50%); z-index: 2; }
  .tip .tl { color: var(--muted); margin-bottom: 2px; }
  .tip .row { display: flex; align-items: center; gap: 6px; }
  .tip .row b { font-variant-numeric: tabular-nums; }
  .key { display: inline-block; width: 12px; height: 3px; border-radius: 2px; }
  .cmp { width: 100%; border: 0; margin: 0 0 4px; font-size: 13px; }
  .cmp caption { font-size: 14px; }
  .cmp caption .key { margin-right: 4px; vertical-align: 1px; }
  .cmp td, .cmp th { padding: 6px 4px; }
  .up { color: var(--made); font-weight: 700; }
  .down { color: var(--miss); font-weight: 700; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .tile .big { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tile .lbl { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .tile small { color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1><span>5</span>-Min Stats</h1>
  <button id="gamesBtn" class="hdr-btn">☰ Games</button>
</header>

<nav class="tabs" id="mainTabs">
  <button data-view="1">Q1</button>
  <button data-view="2">Q2</button>
  <button data-view="3">Q3</button>
  <button data-view="4">Q4</button>
  <button data-view="ot">OT</button>
  <button data-view="summary">Stats</button>
</nav>

<section id="tracker">
  <nav class="tabs sub" id="halfTabs">
    <button data-half="first">First 5 min</button>
    <button data-half="last">Last 5 min</button>
  </nav>
  <div class="scoreboard">
    <div class="period-label" id="periodLabel"></div>
    <div><div class="name-wrap"><input class="team-name" data-team="0" maxlength="20" placeholder="Home team" aria-label="Home team name" enterkeyhint="done"></div><div class="pts" id="pts0">0</div></div>
    <div class="dash">–</div>
    <div><div class="name-wrap"><input class="team-name" data-team="1" maxlength="20" placeholder="Away team" aria-label="Away team name" enterkeyhint="done"></div><div class="pts" id="pts1">0</div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="actions">
    <button id="undo">↶ Undo</button>
    <button id="reset" class="danger">Reset game</button>
  </div>
  <div class="log" id="log"></div>
</section>

<section id="summary" class="hidden">
  <nav class="tabs sub" id="statsMode">
    <button data-mode="tables">Tables</button>
    <button data-mode="insights">Insights</button>
  </nav>
  <div id="insights" class="hidden" style="margin-top:12px"></div>
  <nav class="tabs sub" id="sumTabs" style="margin-bottom:12px">
    <button data-sum="1">Q1</button>
    <button data-sum="2">Q2</button>
    <button data-sum="3">Q3</button>
    <button data-sum="4">Q4</button>
    <button data-sum="ot">OT</button>
    <button data-sum="all">Game</button>
  </nav>
  <div id="summaryTables"></div>
  <div class="actions">
    <button id="share">Share / Copy stats</button>
    <button id="reset2" class="danger">Reset game</button>
  </div>
  <div class="log" id="log2"></div>
</section>

<section id="games" class="hidden">
  <button id="newGame" class="new-game">+ New game</button>
  <div id="gameList"></div>
  <div class="log" id="log3"></div>
</section>

<script>
const KEY = 'fiveminstats.v3';
const SHOTS = [
  { k: 't3', label: '3PT', pts: 3 },
  { k: 't2', label: '2PT', pts: 2 },
  { k: 'ft', label: 'FT',  pts: 1 },
];
const QUARTERS = ['1', '2', '3', '4'];
const HALVES = { first: 'First 5 min', last: 'Last 5 min' };
// OT is only 5 minutes, so it's tracked as one period (all OTs combined)
const OT_HALVES = { full: 'All overtime' };
const halvesFor = q => q === 'ot' ? OT_HALVES : HALVES;
const periodName = (q, half) => q === 'ot' ? 'Overtime' : `Q${q} · ${HALVES[half]}`;

const blankTeam = () => ({ t3m: 0, t3x: 0, t2m: 0, t2x: 0, ftm: 0, ftx: 0 });
const blankStats = () => ({
  ...Object.fromEntries(QUARTERS.map(q =>
    [q, { first: [blankTeam(), blankTeam()], last: [blankTeam(), blankTeam()] }])),
  ot: { full: [blankTeam(), blankTeam()] },
});
const newGame = () => ({
  id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
  created: Date.now(),
  teams: ['Home', 'Away'],
  stats: blankStats(),
  history: [],
});
const blankState = () => {
  const g = newGame();
  return {
    games: [g],     // newest first
    currentId: g.id,
    view: '1',      // '1'..'4', 'ot', 'summary' or 'games'
    half: 'first',  // 'first' | 'last' (ignored in OT)
    sum: '1',       // summary filter: '1'..'4', 'ot' or 'all'
  };
};

let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!state?.games?.length) {
  state = blankState();
  // Bring over the single game saved by the previous version
  try {
    const old = JSON.parse(localStorage.getItem('fiveminstats.v2'));
    if (old?.stats) Object.assign(state.games[0], {
      teams: old.teams, stats: { ...blankStats(), ...old.stats }, history: old.history || [],
    });
  } catch {}
}

let game; // the game currently being tracked
function selectGame(id) {
  game = state.games.find(g => g.id === id) || state.games[0];
  state.currentId = game.id;
}
selectGame(state.currentId);

const curHalf = () => state.view === 'ot' ? 'full' : state.half;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
// Ask the browser not to clear saved games when the phone is low on space
navigator.storage?.persist?.().catch(() => {});

const $ = s => document.querySelector(s);
const pct = (m, a) => a ? Math.round(m / a * 100) + '%' : '–';
const points = s => s.t3m * 3 + s.t2m * 2 + s.ftm;
const sumTeams = list => list.reduce((acc, s) => {
  for (const k in acc) acc[k] += s[k];
  return acc;
}, blankTeam());
// Stats for team t in a half, for one quarter or summed across the game
const statsFor = (q, half, t) => q === 'all'
  ? sumTeams(QUARTERS.map(x => game.stats[x][half][t]))
  : game.stats[q][half][t];

function renderTracker() {
  const stats = game.stats[state.view][curHalf()];
  document.querySelectorAll('.team-name').forEach(i => {
    if (document.activeElement !== i) i.value = game.teams[i.dataset.team];
  });
  $('#halfTabs').classList.toggle('hidden', state.view === 'ot');
  $('#periodLabel').textContent = periodName(state.view, curHalf());
  $('#pts0').textContent = points(stats[0]);
  $('#pts1').textContent = points(stats[1]);

  $('#grid').innerHTML = [0, 1].map(t => `
    <div class="col">
      <h2>${esc(game.teams[t])}</h2>
      ${SHOTS.map(({ k, label }) => {
        const m = stats[t][k + 'm'], x = stats[t][k + 'x'];
        return `<div class="shot">
          <div class="shot-head"><b>${label}</b><span>${m}/${m + x} · ${pct(m, m + x)}</span></div>
          <div class="btns">
            <button class="made" data-t="${t}" data-f="${k}m">✓<small>${m}</small></button>
            <button class="miss" data-t="${t}" data-f="${k}x">✗<small>${x}</small></button>
          </div></div>`;
      }).join('')}
    </div>`).join('');
  $('#undo').disabled = !game.history.length;
}

function row(name, s) {
  const cell = (m, a) => `${m}/${a}<span class="pct">${pct(m, a)}</span>`;
  const fgm = s.t3m + s.t2m, fga = fgm + s.t3x + s.t2x;
  return `<tr><td>${esc(name)}</td>
    <td>${cell(s.t3m, s.t3m + s.t3x)}</td>
    <td>${cell(s.t2m, s.t2m + s.t2x)}</td>
    <td>${cell(fgm, fga)}</td>
    <td>${cell(s.ftm, s.ftm + s.ftx)}</td>
    <td><b>${points(s)}</b></td></tr>`;
}

const otPlayed = () => game.stats.ot.full.some(s => Object.values(s).some(v => v > 0));

// Tables to show for a summary filter: [quarter, half, caption]
function sections(q) {
  if (q === 'ot') return [['ot', 'full', 'Overtime (all OT periods)']];
  if (q !== 'all') return Object.entries(HALVES).map(([half, title]) => [q, half, `Q${q} · ${title}`]);
  return [
    ...Object.entries(HALVES).map(([half, title]) => ['all', half, `Game · all ${title.toLowerCase()}s (Q1–Q4)`]),
    ...(otPlayed() ? sections('ot') : []),
  ];
}

function renderSummary() {
  const insights = state.statsMode === 'insights';
  document.querySelectorAll('#statsMode button').forEach(b => b.classList.toggle('active', b.dataset.mode === (insights ? 'insights' : 'tables')));
  $('#insights').classList.toggle('hidden', !insights);
  $('#sumTabs').classList.toggle('hidden', insights);
  $('#summaryTables').classList.toggle('hidden', insights);
  if (insights) return renderInsights();
  $('#summaryTables').innerHTML = sections(state.sum).map(([q, half, caption]) => `
    <table>
      <caption>${caption}</caption>
      <thead><tr><th>Team</th><th>3PT</th><th>2PT</th><th>FG</th><th>FT</th><th>PTS</th></tr></thead>
      <tbody>${[0, 1].map(t => row(game.teams[t], statsFor(q, half, t))).join('')}</tbody>
    </table>`).join('');
}

// ---------- Insights ----------

const fga = s => s.t3m + s.t3x + s.t2m + s.t2x;
const fgPct = s => fga(s) ? Math.round((s.t3m + s.t2m) / fga(s) * 100) : null;
const rate = (m, x) => m + x ? Math.round(m / (m + x) * 100) : null;
const dot = t => `<span class="key" style="background:var(--team${t});width:8px;height:8px;border-radius:50%"></span>`;
const slotLabel = (q, h) => q === 'ot' ? 'Overtime' : `Q${q} ${h === 'first' ? 'first' : 'last'} 5`;

// Every tracked period in game order, with both teams' stats
const periodSlots = () => [
  ...QUARTERS.flatMap(q => ['first', 'last'].map(h => ({ q, h }))),
  ...(otPlayed() ? [{ q: 'ot', h: 'full' }] : []),
].map(p => ({ ...p, label: slotLabel(p.q, p.h), s: game.stats[p.q][p.h] }));

// Biggest scoring run per team: consecutive points with no reply from the
// other team, counted within one tracked period (the minutes between are unknown)
function biggestRuns() {
  const best = [null, null];
  let cur = null, period = null;
  for (const h of game.history) {
    if (!h.q || !h.f.endsWith('m')) continue; // misses don't end a run
    if (h.q + h.h !== period) { period = h.q + h.h; cur = null; }
    const pts = SHOTS.find(s => h.f.startsWith(s.k)).pts;
    cur = cur && cur.t === h.t ? { ...cur, pts: cur.pts + pts } : { t: h.t, pts, q: h.q, h: h.h };
    if (!best[h.t] || cur.pts > best[h.t].pts) best[h.t] = cur;
  }
  return best;
}

function keyInsights(slots, runs) {
  const [n0, n1] = game.teams.map(esc);
  const names = [n0, n1];
  const out = [];
  const add = (t, html) => out.push({ t, html });
  const F = [0, 1].map(t => statsFor('all', 'first', t));
  const L = [0, 1].map(t => statsFor('all', 'last', t));

  for (const [S, what] of [[F, 'first 5s'], [L, 'last 5s']]) {
    const [a, b] = S.map(points);
    if (!a && !b) continue;
    if (a === b) add(null, `The ${what} are tied <b>${a}–${b}</b>.`);
    else { const w = a > b ? 0 : 1; add(w, `<b>${names[w]}</b> won the ${what} <b>${Math.max(a, b)}–${Math.min(a, b)}</b> (Q1–Q4).`); }
  }

  [0, 1].forEach(t => {
    const f = fgPct(F[t]), l = fgPct(L[t]);
    if (fga(F[t]) >= 4 && fga(L[t]) >= 4 && Math.abs(f - l) >= 10)
      add(t, `<b>${names[t]}</b> shot <b>${f}%</b> FG in first 5s vs <b>${l}%</b> in last 5s – ${l < f ? 'they fade late' : 'they finish strong'}.`);
  });

  const margins = slots.map(p => ({ ...p, m: points(p.s[0]) - points(p.s[1]) }));
  const top = margins.reduce((a, b) => b.m > a.m ? b : a, { m: 0 });
  const low = margins.reduce((a, b) => b.m < a.m ? b : a, { m: 0 });
  const poss = t => names[t] + (/s$/i.test(game.teams[t]) ? '’' : '’s');
  if (top.m > 0) add(0, `<b>${poss(0)}</b> best stretch: ${top.label} (<b>+${top.m}</b>).`);
  if (low.m < 0) add(1, `<b>${poss(1)}</b> best stretch: ${low.label} (<b>+${-low.m}</b>).`);

  const q4 = game.stats['4'].last.map(points);
  if (q4[0] || q4[1]) {
    if (q4[0] === q4[1]) add(null, `The final 5 minutes of Q4 were even at <b>${q4[0]}–${q4[1]}</b>.`);
    else { const w = q4[0] > q4[1] ? 0 : 1; add(w, `<b>${names[w]}</b> won the final 5 minutes of Q4 <b>${Math.max(...q4)}–${Math.min(...q4)}</b>.`); }
  }

  [0, 1].forEach(t => {
    const all = sumTeams([F[t], L[t], game.stats.ot.full[t]]);
    const p = points(all);
    if (p >= 10 && all.t3m * 3 / p >= 0.4) add(t, `<b>${names[t]}</b> got <b>${Math.round(all.t3m * 300 / p)}%</b> of their points from threes.`);
    const lft = L[t].ftm + L[t].ftx;
    if (lft >= 4) add(t, `<b>${names[t]}</b> went <b>${L[t].ftm}/${lft}</b> at the line in last 5s (${rate(L[t].ftm, L[t].ftx)}%).`);
  });

  const r = runs.filter(Boolean).sort((a, b) => b.pts - a.pts)[0];
  if (r && r.pts >= 6) add(r.t, `Biggest run: <b>${names[r.t]} ${r.pts}–0</b> in ${slotLabel(r.q, r.h)}.`);
  return out;
}

// Grouped chart over the tracked periods. kind: 'bar' | 'line'.
// value(s) returns a number or null (no data) for one team's stats.
function periodChart(id, slots, { kind, value, yMax, ticks, fmt }) {
  const W = 340, H = 180, m = { l: 30, r: 6, t: 8, b: 34 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = slots.length, sw = iw / n;
  const cx = i => m.l + sw * (i + 0.5);
  const y = v => m.t + ih - v / yMax * ih;
  let g = '';

  ticks.forEach(v => {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v ? 1 : 1.5}"/>
      <text class="axis" x="${m.l - 5}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text>`;
  });
  // x labels: F5 / L5 under each slot, quarter name under each pair
  slots.forEach((p, i) => {
    g += `<text class="axis" x="${cx(i)}" y="${H - m.b + 13}" text-anchor="middle">${p.q === 'ot' ? '' : p.h === 'first' ? 'F5' : 'L5'}</text>`;
    if (p.h !== 'last') {
      const mid = p.q === 'ot' ? cx(i) : (cx(i) + cx(i + 1)) / 2;
      g += `<text class="qlabel" x="${mid}" y="${H - 6}" text-anchor="middle">${p.q === 'ot' ? 'OT' : 'Q' + p.q}</text>`;
      if (i) g += `<line x1="${m.l + sw * i}" x2="${m.l + sw * i}" y1="${m.t}" y2="${H - 4}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
    }
  });
  g += `<rect class="wash" y="${m.t}" width="${sw}" height="${ih}" rx="4"/>`;

  const vals = slots.map(p => [0, 1].map(t => value(p.s[t])));
  if (kind === 'bar') {
    const bw = Math.min(12, sw * 0.32);
    vals.forEach((vs, i) => vs.forEach((v, t) => {
      if (!v) return;
      const x = t ? cx(i) + 1 : cx(i) - bw - 1, top = y(v), base = y(0), r = Math.min(4, bw / 2, base - top);
      g += `<path fill="var(--team${t})" d="M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${base}Z"/>`;
    }));
  } else {
    [0, 1].forEach(t => {
      // Break the line where a period has no attempts
      let d = '', pen = false;
      vals.forEach((vs, i) => {
        if (vs[t] == null) { pen = false; return; }
        d += `${pen ? 'L' : 'M'}${cx(i)},${y(vs[t])}`; pen = true;
      });
      g += `<path d="${d}" fill="none" stroke="var(--team${t})" stroke-width="2" stroke-linejoin="round"/>`;
      vals.forEach((vs, i) => {
        if (vs[t] == null) return;
        g += t
          ? `<rect x="${cx(i) - 4}" y="${y(vs[t]) - 4}" width="8" height="8" rx="1.5" fill="var(--team1)" stroke="var(--card)" stroke-width="2"/>`
          : `<circle cx="${cx(i)}" cy="${y(vs[t])}" r="4" fill="var(--team0)" stroke="var(--card)" stroke-width="2"/>`;
      });
    });
  }
  // One hit column per period: the tooltip lists both teams
  slots.forEach((p, i) => {
    g += `<rect class="hit" data-i="${i}" x="${m.l + sw * i}" y="0" width="${sw}" height="${H}" tabindex="0" aria-label="${p.label}"/>`;
  });
  chartTips[id] = { slots, vals, fmt };
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="tip hidden"></div></div>`;
}
const chartTips = {};

function legend(kind) {
  return `<div class="legend">${[0, 1].map(t => `<span>${kind === 'bar'
    ? `<span class="key" style="background:var(--team${t});width:10px;height:10px;border-radius:2px"></span>`
    : `<svg width="18" height="10"><line x1="0" x2="18" y1="5" y2="5" stroke="var(--team${t})" stroke-width="2"/>${t
        ? '<rect x="5" y="1" width="8" height="8" rx="1.5" fill="var(--team1)"/>'
        : '<circle cx="9" cy="5" r="4" fill="var(--team0)"/>'}</svg>`}${esc(game.teams[t])}</span>`).join('')}</div>`;
}

function compareTable(t) {
  const f = statsFor('all', 'first', t), l = statsFor('all', 'last', t);
  const delta = (a, b) => a == null || b == null ? '–'
    : b === a ? '0' : `<span class="${b > a ? 'up' : 'down'}">${b > a ? '▲' : '▼'} ${Math.abs(b - a)}</span>`;
  const pc = v => v == null ? '–' : v + '%';
  const rows = [
    ['Points', points(f), points(l)],
    ['FG%', fgPct(f), fgPct(l), true],
    ['3P%', rate(f.t3m, f.t3x), rate(l.t3m, l.t3x), true],
    ['FT%', rate(f.ftm, f.ftx), rate(l.ftm, l.ftx), true],
  ];
  return `<table class="cmp"><caption>${dot(t)} ${esc(game.teams[t])}</caption>
    <thead><tr><th></th><th>First 5s</th><th>Last 5s</th><th>Change</th></tr></thead>
    <tbody>${rows.map(([k, a, b, isPct]) => `<tr><td>${k}</td>
      <td>${isPct ? pc(a) : a}</td><td>${isPct ? pc(b) : b}</td><td>${delta(a, b)}</td></tr>`).join('')}</tbody></table>`;
}

function renderInsights() {
  const slots = periodSlots();
  const runs = biggestRuns();
  const list = keyInsights(slots, runs);
  const maxPts = Math.max(4, ...slots.flatMap(p => p.s.map(points)));
  const step = maxPts <= 8 ? 2 : maxPts <= 20 ? 5 : 10;
  const yMax = Math.ceil(maxPts / step) * step;
  const ptTicks = Array.from({ length: yMax / step + 1 }, (_, i) => i * step);

  $('#insights').innerHTML = `
    <div class="card"><h3>Key insights</h3>
      ${list.length
        ? `<ul class="insight-list">${list.map(i => `<li style="--dot:${i.t == null ? 'var(--muted)' : `var(--team${i.t})`}">${i.html}</li>`).join('')}</ul>`
        : '<p class="note">Log a few shots and insights will appear here.</p>'}
    </div>
    <div class="card"><h3>First 5 vs last 5 (Q1–Q4)</h3>${compareTable(0)}${compareTable(1)}
      <p class="note">Change is in points, or percentage points for shooting.</p></div>
    <div class="card"><h3>Points by period</h3>${legend('bar')}
      ${periodChart('chartPts', slots, { kind: 'bar', value: points, yMax, ticks: ptTicks, fmt: v => v })}
      <p class="note">Tap a period for exact numbers.</p></div>
    <div class="card"><h3>FG% by period</h3>${legend('line')}
      ${periodChart('chartFg', slots, { kind: 'line', value: fgPct, yMax: 100, ticks: [0, 50, 100], fmt: v => v + '%' })}
      <p class="note">Gaps mean no field goals were attempted in that period.</p></div>
    <div class="card"><h3>Biggest scoring runs</h3>
      <div class="tiles">${[0, 1].map(t => `<div class="tile">
        <div class="lbl">${dot(t)} ${esc(game.teams[t])}</div>
        <div class="big">${runs[t] ? runs[t].pts + '–0' : '–'}</div>
        <small>${runs[t] ? slotLabel(runs[t].q, runs[t].h) : 'No points yet'}</small></div>`).join('')}</div>
      <p class="note">Points in a row without the other team scoring, within one tracked period.</p></div>`;

  document.querySelectorAll('#insights .chart').forEach(wireTips);
}

function wireTips(chart) {
  const { slots, vals, fmt } = chartTips[chart.id];
  const tip = chart.querySelector('.tip'), wash = chart.querySelector('.wash');
  const show = hit => {
    const i = +hit.dataset.i;
    tip.innerHTML = `<div class="tl">${slots[i].label}</div>` + [0, 1].map(t =>
      `<div class="row"><span class="key" style="background:var(--team${t})"></span><b>${vals[i][t] == null ? '–' : fmt(vals[i][t])}</b> ${esc(game.teams[t])}</div>`).join('');
    tip.classList.remove('hidden');
    wash.setAttribute('x', hit.getAttribute('x'));
    wash.classList.add('on');
    const box = chart.getBoundingClientRect(), r = hit.getBoundingClientRect();
    const half = tip.offsetWidth / 2;
    tip.style.left = Math.min(Math.max(r.left - box.left + r.width / 2, half), box.width - half) + 'px';
    tip.style.top = -tip.offsetHeight - 4 + 'px';
  };
  const hide = () => { tip.classList.add('hidden'); wash.classList.remove('on'); };
  chart.addEventListener('pointermove', e => { const h = e.target.closest('.hit'); h ? show(h) : hide(); });
  chart.addEventListener('pointerdown', e => { const h = e.target.closest('.hit'); if (h) show(h); });
  chart.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
  chart.addEventListener('focusin', e => { const h = e.target.closest('.hit'); if (h) show(h); });
  chart.addEventListener('focusout', hide);
}

function render() {
  document.querySelectorAll('#mainTabs button').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  document.querySelectorAll('#halfTabs button').forEach(b => b.classList.toggle('active', b.dataset.half === state.half));
  document.querySelectorAll('#sumTabs button').forEach(b => b.classList.toggle('active', b.dataset.sum === state.sum));
  const v = state.view;
  $('#gamesBtn').classList.toggle('active', v === 'games');
  $('#tracker').classList.toggle('hidden', v === 'summary' || v === 'games');
  $('#summary').classList.toggle('hidden', v !== 'summary');
  $('#games').classList.toggle('hidden', v !== 'games');
  if (v === 'games') renderGames();
  else if (v === 'summary') renderSummary();
  else renderTracker();
}

const fmtDate = ts => new Date(ts).toLocaleString(undefined,
  { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
// Points logged in all tracked periods of a game, for team t
const trackedPoints = (g, t) => Object.values(g.stats)
  .flatMap(period => Object.values(period).map(teams => points(teams[t])))
  .reduce((a, b) => a + b, 0);

function renderGames() {
  $('#gameList').innerHTML = state.games.map(g => `
    <div class="game-item${g.id === game.id ? ' current' : ''}">
      <button class="open" data-open="${g.id}">
        <b>${esc(g.teams[0])} vs ${esc(g.teams[1])}</b>
        <small>${fmtDate(g.created)} · ${trackedPoints(g, 0)}–${trackedPoints(g, 1)} tracked pts
          ${g.id === game.id ? ' · <span class="badge">Current</span>' : ''}</small>
      </button>
      <button class="del" data-del="${g.id}" aria-label="Delete game">🗑</button>
    </div>`).join('');
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function flash(msg, el = '#log') {
  $(el).textContent = msg;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => $(el).textContent = '', 2500);
}

function describe(h) {
  const shot = SHOTS.find(s => h.f.startsWith(s.k)).label;
  const where = h.q === 'ot' ? 'OT' : `Q${h.q} ${h.h} 5`;
  return `${where} – ${game.teams[h.t]} ${shot} ${h.f.endsWith('m') ? 'made' : 'missed'}`;
}

// Events
$('#mainTabs').addEventListener('click', e => {
  const v = e.target.closest('button')?.dataset.view;
  if (!v) return;
  const fromPeriod = state.view !== 'summary' && state.view !== 'games';
  // Opening the summary jumps to the quarter you were tracking
  if (v === 'summary' && fromPeriod) state.sum = state.view;
  // Switching to a different quarter starts at its first 5 minutes
  if (v !== 'summary' && fromPeriod && v !== state.view) state.half = 'first';
  state.view = v; save(); render();
});

$('#halfTabs').addEventListener('click', e => {
  const h = e.target.closest('button')?.dataset.half;
  if (!h) return;
  state.half = h; save(); render();
});

$('#statsMode').addEventListener('click', e => {
  const m = e.target.closest('button')?.dataset.mode;
  if (!m) return;
  state.statsMode = m; save(); render();
});

$('#sumTabs').addEventListener('click', e => {
  const q = e.target.closest('button')?.dataset.sum;
  if (!q) return;
  state.sum = q; save(); render();
});

$('#grid').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]');
  if (!b) return;
  const h = { q: state.view, h: curHalf(), t: +b.dataset.t, f: b.dataset.f };
  game.stats[h.q][h.h][h.t][h.f]++;
  game.history.push(h);
  if (navigator.vibrate) navigator.vibrate(15);
  save(); render();
  flash(describe(h));
});

$('#undo').addEventListener('click', () => {
  const h = game.history.pop();
  if (!h) return;
  const s = game.stats[h.q][h.h][h.t];
  s[h.f] = Math.max(0, s[h.f] - 1);
  state.view = h.q;
  if (h.h !== 'full') state.half = h.h;
  save(); render();
  flash('Undid: ' + describe(h));
});

document.querySelectorAll('.team-name').forEach(i => {
  i.addEventListener('input', () => {
    game.teams[i.dataset.team] = i.value.trim() || (i.dataset.team === '0' ? 'Home' : 'Away');
    save(); renderTracker();
  });
  i.addEventListener('focus', () => i.select());
  i.addEventListener('blur', () => { i.value = game.teams[i.dataset.team]; });
  i.addEventListener('keydown', e => { if (e.key === 'Enter') i.blur(); });
});

function reset() {
  if (!confirm('Clear all stats for this game? Team names are kept.')) return;
  game.stats = blankStats();
  game.history = [];
  state.view = '1'; state.half = 'first';
  save(); render();
}
$('#reset').addEventListener('click', reset);
$('#reset2').addEventListener('click', reset);

// Saved games
$('#gamesBtn').addEventListener('click', () => {
  state.view = state.view === 'games' ? '1' : 'games';
  save(); render();
});

$('#newGame').addEventListener('click', () => {
  const g = newGame();
  state.games.unshift(g);
  selectGame(g.id);
  state.view = '1'; state.half = 'first'; state.sum = '1';
  save(); render();
  flash('New game started – tap the team names to set them');
});

$('#gameList').addEventListener('click', e => {
  const open = e.target.closest('[data-open]')?.dataset.open;
  const del = e.target.closest('[data-del]')?.dataset.del;
  if (open) {
    selectGame(open);
    state.view = '1'; state.half = 'first'; state.sum = '1';
    save(); render();
  } else if (del) {
    const g = state.games.find(x => x.id === del);
    if (!confirm(`Delete "${g.teams[0]} vs ${g.teams[1]}" (${fmtDate(g.created)})? This can't be undone.`)) return;
    state.games = state.games.filter(x => x.id !== del);
    if (!state.games.length) state.games.push(newGame());
    if (del === game.id) selectGame(state.games[0].id);
    save(); render();
    flash('Game deleted', '#log3');
  }
});

$('#share').addEventListener('click', async () => {
  const f = (m, x) => `${m}/${m + x} (${pct(m, m + x)})`;
  const lines = [`${game.teams[0]} vs ${game.teams[1]} – 5-min shooting stats`, fmtDate(game.created), ''];
  const groups = [...QUARTERS, ...(otPlayed() ? ['ot'] : []), 'all'];
  const heading = { ot: '== OVERTIME ==', all: '== GAME TOTALS (Q1–Q4) ==' };
  for (const q of groups) {
    lines.push(heading[q] || `== Q${q} ==`);
    for (const [half, title] of Object.entries(halvesFor(q))) {
      if (q !== 'ot') lines.push(`${title}:`);
      [0, 1].forEach(t => {
        const s = statsFor(q, half, t);
        lines.push(`  ${game.teams[t]}: ${points(s)} pts | 3PT ${f(s.t3m, s.t3x)} | 2PT ${f(s.t2m, s.t2x)} | FT ${f(s.ftm, s.ftx)}`);
      });
    }
    lines.push('');
  }
  const text = lines.join('\n').trim();
  try {
    if (navigator.share) await navigator.share({ title: '5-Min Stats', text });
    else { await navigator.clipboard.writeText(text); flash('Copied to clipboard', '#log2'); }
  } catch (err) {
    if (err.name !== 'AbortError') flash('Could not share', '#log2');
  }
});

render();

// Offline support (only works when served over http/https)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
